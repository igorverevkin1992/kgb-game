name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Пакеты для виртуального экрана
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
      - name: Godot и шаблоны экспорта
        run: tools/get-godot.sh templates
      - name: Импорт проекта
        run: timeout 300 "$(tools/get-godot.sh)" --headless --path . --import || true
      - name: Проверка контента
        run: tools/validate.sh
      - name: Unit-тесты движка
        run: tools/test.sh
      - name: Сценарии интерфейса (Xvfb)
        run: tools/ui-test.sh
      - name: Сборки Windows (полная и демоверсия) и Web
        run: tools/export.sh all
      - name: Скриншоты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: build/screens/
          if-no-files-found: ignore
          retention-days: 14
      - name: Windows-сборка
        uses: actions/upload-artifact@v4
        with:
          name: GodShpionov-windows
          path: build/windows/
          retention-days: 30
      - name: Windows-демоверсия
        uses: actions/upload-artifact@v4
        with:
          name: GodShpionov-windows-demo
          path: build/windows-demo/
          retention-days: 30
